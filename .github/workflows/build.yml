name: Build usd-core linux-aarch64 wheels

on:
  workflow_dispatch:
    inputs:
      usd_ref:
        description: 'OpenUSD ref (branch, tag, or SHA)'
        default: 'release'
      release_tag:
        description: 'GitHub Release tag for the wheels (e.g. 26.8-arm64-linux)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python:
          - tag: cp312
            interpreter: /opt/python/cp312-cp312/bin/python
          - tag: cp313
            interpreter: /opt/python/cp313-cp313/bin/python
          - tag: cp314
            interpreter: /opt/python/cp314-cp314/bin/python
    timeout-minutes: 120
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64:latest
    steps:
      - name: Install cmake
        run: |
          ${{ matrix.python.interpreter }} -m pip install --upgrade pip
          ${{ matrix.python.interpreter }} -m pip install cmake setuptools wheel auditwheel

      - name: Checkout OpenUSD
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: ${{ github.event.inputs.usd_ref }}
          path: OpenUSD

      - name: FindPython stub library workaround
        working-directory: OpenUSD
        run: |
          ${{ matrix.python.interpreter }} -c "import pathlib,sysconfig; pathlib.Path(sysconfig.get_config_var('LIBDIR'), sysconfig.get_config_var('LDLIBRARY')).touch()"

      - name: Build USD (monolithic, python bindings only)
        working-directory: OpenUSD
        run: |
          ${{ matrix.python.interpreter }} build_scripts/build_usd.py \
            --build-monolithic \
            --no-imaging --no-materialx --no-usdview --no-tools --no-examples --no-tutorials \
            --no-tests --no-docs \
            $PWD/inst

      - name: Package wheel
        working-directory: OpenUSD/build_scripts/pypi
        run: |
          ${{ matrix.python.interpreter }} setup.py bdist_wheel \
            --python-tag ${{ matrix.python.tag }} \
            --plat-name manylinux_2_28_aarch64 \
            --dist-dir $GITHUB_WORKSPACE/dist-raw

      - name: Repair with auditwheel
        run: |
          mkdir -p dist
          ${{ matrix.python.interpreter }} -m auditwheel repair \
            --plat manylinux_2_28_aarch64 \
            -w dist \
            dist-raw/*.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usd-core-${{ matrix.python.tag }}-aarch64
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "$TAG" \
                 --notes "usd-core wheels built from PixarAnimationStudios/OpenUSD@${{ github.event.inputs.usd_ref }} for manylinux_2_28_aarch64."
          gh release upload "$TAG" dist/*.whl --repo "${{ github.repository }}" --clobber
