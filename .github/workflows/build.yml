name: Build usd-core linux-aarch64 wheels

on:
  workflow_dispatch:
    inputs:
      usd_ref:
        description: 'OpenUSD ref (branch, tag, or SHA)'
        default: 'release'
      release_tag:
        description: 'GitHub Release tag for the wheels (e.g. 26.8-arm64-linux)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python:
          - tag: cp312
            interpreter: /opt/python/cp312-cp312/bin/python
          - tag: cp313
            interpreter: /opt/python/cp313-cp313/bin/python
          - tag: cp314
            interpreter: /opt/python/cp314-cp314/bin/python
    timeout-minutes: 120
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64:latest
    steps:
      - name: Install python build deps + cmake
        run: |
          ${{ matrix.python.interpreter }} -m pip install --upgrade pip
          ${{ matrix.python.interpreter }} -m pip install cmake setuptools wheel auditwheel jinja2

      - name: Checkout OpenUSD
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: ${{ github.event.inputs.usd_ref }}
          path: OpenUSD

      - name: FindPython stub library workaround
        working-directory: OpenUSD
        run: |
          ${{ matrix.python.interpreter }} -c "import pathlib,sysconfig; pathlib.Path(sysconfig.get_config_var('LIBDIR'), sysconfig.get_config_var('LDLIBRARY')).touch()"

      - name: Build USD (upstream flags)
        working-directory: OpenUSD
        run: |
          ${{ matrix.python.interpreter }} build_scripts/build_usd.py \
            --build-monolithic \
            --build-args USD,"-DPXR_PY_UNDEFINED_DYNAMIC_LOOKUP=ON -DPXR_BUILD_USD_TOOLS=OFF -DPXR_BUILD_EXEC=OFF -DPXR_INSTALL_LOCATION=../pxr/pluginfo -DPXR_PYTHON_INSTALL_DIR=lib/python" \
            --no-materialx --no-imaging --no-examples --no-tutorials \
            --build $PWD/gen/build --src $PWD/gen/src \
            $PWD/inst \
            -v

      - name: Assemble packaging directory
        working-directory: OpenUSD
        run: |
          mkdir packaging
          cp -R inst packaging/inst
          cp build_scripts/pypi/package_files/* packaging/
          cp LICENSE.txt packaging/

      - name: Run setup.py bdist_wheel
        working-directory: OpenUSD/packaging
        run: |
          ${{ matrix.python.interpreter }} setup.py bdist_wheel --python-tag ${{ matrix.python.tag }}

      - name: auditwheel repair
        working-directory: OpenUSD
        run: |
          PYTHONPATH=$PWD/packaging/pypi/lib/python \
          LD_LIBRARY_PATH=$PWD/packaging/pypi/lib \
          ${{ matrix.python.interpreter }} -m auditwheel repair \
            --plat manylinux_2_28_aarch64 \
            -w wheelhouse \
            packaging/dist/*.whl

      - name: updatePluginfos
        working-directory: OpenUSD
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          WHEEL=$(ls wheelhouse | head -1)
          ${{ matrix.python.interpreter }} build_scripts/pypi/updatePluginfos.py \
            "wheelhouse/$WHEEL" \
            "$GITHUB_WORKSPACE/dist/$WHEEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usd-core-${{ matrix.python.tag }}-aarch64
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "$TAG" \
                 --notes "usd-core wheels built from PixarAnimationStudios/OpenUSD@${{ github.event.inputs.usd_ref }} for manylinux_2_28_aarch64."
          gh release upload "$TAG" dist/*.whl --repo "${{ github.repository }}" --clobber
